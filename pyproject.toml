[project]
name = "tubetran"
version = "0.1.17"
description = "水管譯工 (TubeTran)：播放 YouTube 並顯示 Claude 翻譯的雙語字幕"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "codemee" }]
keywords = ["youtube", "subtitles", "translation", "claude", "whisper", "bilingual", "traditional-chinese"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Chinese (Traditional)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
# 上限：較新的 Python 可能缺少 onnxruntime 等依賴的預編譯套件
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.8.0",
    # av 19 拿掉了 av.open() 的 metadata_errors 參數，faster-whisper 1.2.1 讀音檔時還在用（TypeError）。
    # 等 faster-whisper 修正後再放寬（tests/test_transcribe_audio.py 會抓到）
    "av>=16,<19",
    "fastapi>=0.162.7",
    "faster-whisper>=1.2.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.10.26",
]

[project.urls]
Homepage = "https://github.com/codemee/tubetran"
Repository = "https://github.com/codemee/tubetran"
Issues = "https://github.com/codemee/tubetran/issues"
Releases = "https://github.com/codemee/tubetran/releases"

[project.scripts]
tubetran = "tubetran.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tubetran"]  # tubetran/static 在套件內，會一併打包

[project.optional-dependencies]
desktop = [
    "pywebview>=6.2.1",
]
# Linux 建議用這個：pywebview 的 GTK 後端要系統套件（PyGObject、WebKit2GTK），Qt 後端直接從 PyPI 安裝
desktop-qt = [
    "pywebview[qt]>=6.2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
