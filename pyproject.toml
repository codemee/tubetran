[project]
name = "trantube"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.7",
    "faster-whisper>=1.2.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
