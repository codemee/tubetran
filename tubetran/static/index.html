<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水管譯工</title>
  <link id="favicon" rel="icon" href="/static/logo/tubetran-light-icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1646a0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1030" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <script>
    // 載入前先套用主題與語系，避免閃爍。
    // 主題／語系只有明確選了才記錄；沒有記錄（預設）就跟隨系統。
    (function () {
      var d = document.documentElement, theme = "auto", lang = "auto";
      try {
        var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") theme = t;
        var l = localStorage.getItem("lang"); if (l === "zh-TW" || l === "en") lang = l;
      } catch (_) {}
      if (theme !== "auto") d.dataset.theme = theme;
      var eff = lang !== "auto" ? lang : (/^zh/i.test(navigator.language || "") ? "zh-TW" : "en");
      d.lang = eff === "en" ? "en" : "zh-Hant";
      d.dataset.lang = eff === "en" ? "en" : "zh";
      document.title = eff === "en" ? "TubeTran" : "水管譯工";
      var dark = theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.getElementById("favicon").href =
        "/static/logo/" + (dark ? "tubetran-dark-icon.svg" : "tubetran-light-icon.svg");
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <!-- 標誌：只有圖示，不放程式名稱（名稱只出現在網頁標題與桌面版視窗標題）；淺色／深色各一個，由 CSS 依主題只顯示其中一個 -->
    <div class="brand">
      <img class="brand-logo light" src="/static/logo/tubetran-light-icon.svg" alt="" aria-hidden="true">
      <img class="brand-logo dark" src="/static/logo/tubetran-dark-icon.svg" alt="" aria-hidden="true">
    </div>
    <form id="form">
      <input id="url" placeholder="貼上 YouTube 網址，按 Enter 載入" data-i18n-attr="placeholder:url_ph" required autocomplete="off">
      <button class="btn primary" data-i18n="load">載入</button>
    </form>
    <!-- 三態按鈕：每按一下切換到下一個狀態（自動 → 第二個 → 第三個 → 自動）。
         圖示全部是單色向量（currentColor），不使用有自己顏色的字元／emoji。 -->
    <div class="hdr-ctrls">
      <!-- 設定：展開下方的設定面板（API 金鑰、翻譯模型、STT 模型）。圖示：三條帶旋鈕的滑桿 -->
      <button id="settings-btn" class="btn icon ctrl-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel"
              data-i18n-attr="title:set_btn;aria-label:set_btn">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h8M16 17h4"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="14" cy="17" r="2"/>
        </svg>
      </button>
      <div id="settings-panel" class="card" role="dialog" aria-labelledby="set-title" hidden>
        <h2 id="set-title" data-i18n="set_title">設定</h2>
        <form id="set-form" autocomplete="off">
          <label class="fld">
            <span data-i18n="set_key">Claude API 金鑰</span>
            <input id="set-key" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" maxlength="400"
                   data-i18n-attr="placeholder:set_key_ph">
            <small id="set-key-hint"></small>
          </label>
          <label class="fld">
            <span data-i18n="set_tmodel">翻譯模型</span>
            <select id="set-tmodel"></select>
            <small id="set-tmodel-hint"></small>
          </label>
          <label class="fld">
            <span data-i18n="set_wmodel">語音辨識（STT）模型</span>
            <select id="set-wmodel"></select>
            <small id="set-wmodel-hint" data-i18n="set_wmodel_hint">只在影片沒有字幕時使用；模型越大越準，也越慢、下載越大。</small>
          </label>
          <div class="set-actions">
            <span id="set-msg" role="status" aria-live="polite"></span>
            <button id="set-save" class="btn primary" data-i18n="set_save">儲存</button>
          </div>
        </form>
        <div class="set-ver">
          <a id="set-ver" data-ext target="_blank" rel="noopener noreferrer" href="https://github.com/codemee/tubetran/releases"
             data-i18n-attr="title:set_ver_tip">TubeTran</a>
        </div>
      </div>
      <button id="lang-btn" class="btn icon ctrl-btn" type="button" data-state="auto">
        <!-- 自動（跟隨系統語言）：地球 -->
        <svg class="st" data-s="auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>
        </svg>
        <span class="st txt" data-s="zh-TW" aria-hidden="true">中</span>
        <span class="st txt" data-s="en" aria-hidden="true">EN</span>
      </button>
      <button id="theme-btn" class="btn icon ctrl-btn" type="button" data-state="auto">
        <!-- 自動（跟隨系統配色）：半填色、半不填色的圓 -->
        <svg class="st" data-s="auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/>
        </svg>
        <!-- 淺色：太陽 -->
        <svg class="st" data-s="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>
        </svg>
        <!-- 深色：月亮 -->
        <svg class="st" data-s="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/>
        </svg>
      </button>
    </div>
    <!-- 視窗按鈕：桌面版（無框視窗）才會顯示，由 desktop.js 啟用。圖示一律單色（currentColor） -->
    <div id="win-ctrls" hidden>
      <button id="win-min" type="button" data-i18n-attr="title:win_min;aria-label:win_min">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M1.5 6h9"/></svg>
      </button>
      <button id="win-max" type="button" data-state="max">
        <svg class="i-max" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.8" y="1.8" width="8.4" height="8.4" rx="1"/></svg>
        <svg class="i-restore" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.8" y="3.8" width="6.4" height="6.4" rx="1"/><path d="M3.8 3.8V2.8a1 1 0 0 1 1-1h5.4a1 1 0 0 1 1 1v5.4a1 1 0 0 1-1 1H8.2"/></svg>
      </button>
      <button id="win-close" type="button" data-i18n-attr="title:win_close;aria-label:win_close">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>
      </button>
    </div>
  </header>
  <!-- 視窗邊緣的縮放把手（無框視窗沒有系統邊框）：桌面版才啟用，最大化時隱藏 -->
  <div id="resize-handles" hidden aria-hidden="true">
    <i data-edge="n"></i><i data-edge="s"></i><i data-edge="e"></i><i data-edge="w"></i>
    <i data-edge="ne"></i><i data-edge="nw"></i><i data-edge="se"></i><i data-edge="sw"></i>
  </div>

  <!-- 頂欄以下才是可捲動的區域（視窗本身不捲動） -->
  <div class="page-scroll">
  <main class="layout">
    <section class="col-main">
      <div id="stage">
        <div id="empty" data-i18n="empty">貼上 YouTube 網址，或從右側選一支已翻譯的影片</div>
        <div id="player"></div>
        <div id="overlay"></div>
        <div id="busy" hidden><span class="spin" aria-hidden="true"></span><span id="busy-text"></span></div>
        <button id="fs" type="button" title="全螢幕 (F)" aria-label="全螢幕" data-i18n-attr="title:fs;aria-label:fs">
          <!-- 全螢幕：四個角的線條圖示（單色，和 YouTube 播放器的按鈕風格一致） -->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        </button>
      </div>

      <!-- 影片標題：有譯名時譯名為主、原標題為輔（與右側影片清單一致） -->
      <div id="vtitle" hidden>
        <div class="vt-main"></div>
        <div class="vt-orig" hidden></div>
        <a id="vt-yt" class="yt-link" data-ext target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          <span data-i18n="yt_open">在 YouTube 開啟</span>
        </a>
      </div>

      <div id="progress" class="card" hidden aria-live="polite">
        <ol class="steps">
          <li data-step="subs" data-i18n="step_subs">取得字幕</li>
          <li data-step="stt" data-i18n="step_stt" hidden>語音辨識</li>
          <li data-step="trans" data-i18n="step_trans">翻譯</li>
        </ol>
        <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="pfill" class="fill"></div></div>
        <div class="pline"><span id="plabel"></span><b id="ppct"></b></div>
        <ol id="stt-stages" hidden></ol>
        <p id="phint" class="phint"></p>
      </div>

      <div id="status" role="status"></div>

      <div id="bar" class="toolbar" hidden>
        <div class="seg" role="radiogroup" aria-label="字幕顯示模式" data-i18n-attr="aria-label:mode_label">
          <label><input type="radio" name="mode" value="both" checked><span data-i18n="mode_both">雙語</span></label>
          <label><input type="radio" name="mode" value="orig"><span data-i18n="mode_orig">原文</span></label>
          <label><input type="radio" name="mode" value="trans"><span data-i18n="mode_trans">譯文</span></label>
        </div>
        <label class="check"><input type="checkbox" id="hide-native" checked> <span data-i18n="hide_native">隱藏 YouTube 原字幕</span></label>
        <span class="sp"></span>
        <a id="dl-srt" class="btn" href="#" data-i18n="dl_srt">下載 SRT</a>
        <a id="dl-vtt" class="btn" href="#" data-i18n="dl_vtt">下載 VTT</a>
      </div>

      <details id="transcript" class="card" hidden>
        <summary><span id="transcript-title"></span></summary>
        <div id="list"></div>
        <button id="follow" type="button" hidden data-i18n="follow_now">回到目前字幕</button>
      </details>
    </section>

    <aside class="col-side" aria-label="已翻譯的影片" data-i18n-attr="aria-label:side_title">
      <!-- 搜尋與標籤篩選：放在 #library 之外，清單重畫時不會失去輸入焦點 -->
      <div id="lib-tools" hidden>
        <input id="lib-search" type="search" placeholder="搜尋標題或標籤" autocomplete="off"
               data-i18n-attr="placeholder:lib_search_ph;aria-label:lib_search_ph">
        <!-- 標籤列：平時收成一行，放不下的標籤收進最後面的「更多 +N」（由頁面的腳本計算）；「清除篩選」固定在右側，不會跟著標籤捲動 -->
        <div id="tag-bar">
          <div id="tag-filter" role="group" aria-label="依標籤篩選" data-i18n-attr="aria-label:tag_filter_label"></div>
          <div id="tag-actions">
            <button id="tag-clear" class="tagchip clear" type="button" hidden data-i18n="tag_clear">清除篩選</button>
          </div>
        </div>
      </div>
      <div id="library"></div>
      <datalist id="tag-suggest"></datalist>
    </aside>
  </main>
  </div>
  <script src="/static/i18n.js"></script>
  <script src="/static/fsbutton.js"></script>
  <script src="/static/linebreak.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/settings.js"></script>
  <script src="/static/desktop.js"></script>
</body>
</html>
