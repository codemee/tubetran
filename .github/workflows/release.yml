name: Release

# 發布新版本（推送 v* 標籤，例如 v0.1.0）時：
#   1. 測試
#   2. 建置 Python 套件（wheel + sdist）並自動發布到 PyPI
#   3. 在 Windows 上用 PyInstaller 打包成 exe，壓成 ZIP
#   4. 建立 GitHub Release，附上 ZIP 與 Python 套件供下載
# 也可以手動執行（Actions → Release → Run workflow）做「試跑」：只建置與測試，不發布。

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手動執行 = 試跑：發布到 PyPI 與建立 Release 的工作只會在推送標籤時執行

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 測試
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: 安裝依賴（含桌面版）
        run: uv sync --locked --extra desktop
      - name: 執行測試
        run: uv run pytest -q

  dist:
    name: 建置 Python 套件
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: 檢查版本號與標籤一致
        id: ver
        shell: bash
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml 的版本：$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::標籤是 $GITHUB_REF_NAME，但 pyproject.toml 的版本是 $version。請先把版本改對、重新打標籤。"
            exit 1
          fi
      - name: 建置 wheel 與 sdist
        run: uv build
      - name: 檢查 PyPI 上的說明文件能否正確顯示
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  exe:
    name: 打包 Windows 執行檔
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: 讀取版本號
        id: ver
        shell: pwsh
        run: |
          $v = uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: 安裝依賴（含桌面版與 PyInstaller）
        run: uv sync --locked --extra desktop
      - name: 用 PyInstaller 打包
        run: uv run pyinstaller packaging/TubeTran.spec --noconfirm --clean --distpath packaging/dist --workpath packaging/build
      - name: 自我檢查（各依賴是否都被正確打包）
        shell: pwsh
        run: |
          $exe = (Resolve-Path packaging/dist/TubeTran/TubeTran.exe).Path
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $env:TUBETRAN_DATA_DIR = Join-Path $env:RUNNER_TEMP "selftest-data"
          $env:TUBETRAN_SELFTEST_OUT = $out
          # 視窗程式沒有主控台輸出，所以看結束碼，並從檔案讀結果
          $p = Start-Process $exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out -Raw }
          if ($p.ExitCode -ne 0) { throw "--selftest 失敗，結束碼 $($p.ExitCode)" }
      - name: 下載情境測試（檔案帶「來自網際網路」標記時，桌面模式需要的 .NET 組件也要能載入）
        shell: pwsh
        run: |
          # 從 GitHub 下載 ZIP 再解壓縮的檔案都帶這個標記，.NET Framework 會拒絕載入帶標記的組件。
          # CI 內部直接建置的檔案沒有標記，所以必須自己加上去，否則測不到這類問題（0.1.1 就是這樣漏掉的）。
          $src = (Resolve-Path packaging/dist/TubeTran).Path
          $dst = Join-Path $env:RUNNER_TEMP "marked/TubeTran"
          New-Item -ItemType Directory (Split-Path $dst) -Force | Out-Null
          Copy-Item -Recurse $src $dst
          $n = 0
          Get-ChildItem $dst -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://github.com/"
            $n++
          }
          "已替 $n 個檔案加上網路來源標記"
          $exe = Join-Path $dst "TubeTran.exe"
          $env:TUBETRAN_DATA_DIR = Join-Path $env:RUNNER_TEMP "marked-data"
          # 用 & 啟動（CreateProcess）：Start-Process 會觸發「開啟檔案 - 安全性警告」對話框而卡住；
          # 接到管線讓 PowerShell 等視窗程式結束
          # 注意：PowerShell 函式會把所有輸出都當成回傳值，所以說明文字用 Write-Host，只回傳結束碼
          function Run-Selftest($label, $out) {
            $env:TUBETRAN_SELFTEST_OUT = $out
            Remove-Item $out -ErrorAction SilentlyContinue
            & $exe --selftest | Out-Null
            $code = [int]$LASTEXITCODE
            Remove-Item Env:TUBETRAN_SELFTEST_OUT
            Write-Host "$label：結束碼 $code"
            if (Test-Path $out) { Get-Content $out -Raw | Select-String '"pythonnet_clr"|"unblocked_dlls"' | ForEach-Object { Write-Host ("  " + $_.Line.Trim()) } }
            return $code
          }
          # 對照組：不清除標記，必須失敗。這證明這個測試真的抓得到問題，而不是永遠通過。
          $env:TUBETRAN_NO_UNBLOCK = "1"
          $control = Run-Selftest "對照組（不清除標記）" (Join-Path $env:RUNNER_TEMP "control.json")
          Remove-Item Env:TUBETRAN_NO_UNBLOCK
          if ($control -eq 0) { throw "對照組應該失敗卻成功了：這個測試抓不到『帶標記就無法載入 .NET 組件』的問題，請檢查測試方法" }
          # 正式：程式啟動時會自己清除標記，必須成功
          $real = Run-Selftest "正式（程式自動清除標記）" (Join-Path $env:RUNNER_TEMP "real.json")
          if ($real -ne 0) { throw "帶網路來源標記的副本無法通過 --selftest（結束碼 $real）" }
      - name: 煙霧測試（以伺服器模式啟動，確認首頁與前端檔可以取得）
        shell: pwsh
        run: |
          $exe = (Resolve-Path packaging/dist/TubeTran/TubeTran.exe).Path
          $env:TUBETRAN_DATA_DIR = Join-Path $env:RUNNER_TEMP "smoke-data"
          $env:ANTHROPIC_API_KEY = "sk-ant-ci-smoke-test"
          $proc = Start-Process $exe -ArgumentList "--server","--port","8017" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep 1
              try { $r = Invoke-WebRequest http://127.0.0.1:8017/ -UseBasicParsing -TimeoutSec 3; $ok = $true; break } catch {}
            }
            if (-not $ok) { throw "伺服器 60 秒內沒有啟動" }
            foreach ($u in "/", "/static/app.js", "/static/desktop.js", "/static/style.css", "/api/settings", "/api/library") {
              $s = (Invoke-WebRequest "http://127.0.0.1:8017$u" -UseBasicParsing -TimeoutSec 20).StatusCode
              "$u -> $s"
              if ($s -ne 200) { throw "$u 回傳 $s" }
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: 壓縮成 ZIP
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item LICENSE, README.md, README.en.md packaging/dist/TubeTran/
          $zip = "TubeTran-v$v-windows-x64.zip"
          Compress-Archive -Path packaging/dist/TubeTran -DestinationPath $zip -CompressionLevel Optimal
          "{0}：{1:N0} MB" -f $zip, ((Get-Item $zip).Length / 1MB)
          # SHA-256 校驗檔（格式同 sha256sum：「雜湊值  檔名」），下載後可以核對檔案沒有損壞或被改動
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          "SHA-256: $hash"
          "zip=$zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            ${{ env.zip }}
            ${{ env.zip }}.sha256
          if-no-files-found: error

  publish-pypi:
    name: 發布到 PyPI
    # 只有推送標籤才會發布；手動試跑不會
    if: github.event_name == 'push'
    needs: [test, dist, exe]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tubetran/
    permissions:
      id-token: write # 受信任的發布者（Trusted Publishing）需要
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # 如果設定了 PYPI_API_TOKEN 這個 secret 就用它；沒有的話（留空）改用受信任的發布者，不需要任何金鑰
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: 建立 GitHub Release
    if: github.event_name == 'push'
    needs: [test, dist, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 建立 Release 並上傳檔案
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          cat > notes.md <<'EOF'
          ## 下載與安裝 / Download

          - **Windows 執行檔：** 下載 `TubeTran-*-windows-x64.zip`，解壓縮後執行 `TubeTran.exe`（桌面模式）。加上 `--server` 則是伺服器模式。第一次執行時在右上角設定面板輸入 Claude API 金鑰。程式沒有數位簽章，Windows SmartScreen 可能會警告。
          - **Python 套件（PyPI）：** `uv tool install --python 3.12 "tubetran[desktop]"`，之後執行 `tubetran`。要加 `--python 3.12`，否則在較新的 Python 上會因語音辨識套件尚無對應版本而安裝失敗。
          - **Windows executable:** download `TubeTran-*-windows-x64.zip`, extract it, and run `TubeTran.exe` (desktop mode); add `--server` for server mode. On first run, enter your Claude API key in the settings panel at the top right. The program is not code-signed, so Windows SmartScreen may warn.
          - **Python package (PyPI):** `uv tool install --python 3.12 "tubetran[desktop]"`, then run `tubetran`. Keep `--python 3.12`: on newer Pythons the install fails because the speech-recognition package has no matching wheels yet.

          ---

          EOF
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TubeTran $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
