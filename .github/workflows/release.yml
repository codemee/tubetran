name: Release

# 發布新版本（推送 v* 標籤，例如 v0.1.0）時：
#   1. 測試
#   2. 建置 Python 套件（wheel + sdist）並自動發布到 PyPI
#   3. 在 Windows 上用 PyInstaller 打包成 exe，壓成 ZIP
#   4. 在 macOS（Apple 晶片）上用 PyInstaller 打包成 App，封裝成 DMG
#   5. 建立 GitHub Release，附上 ZIP、DMG 與 Python 套件供下載
# 也可以手動執行（Actions → Release → Run workflow）做「試跑」：只建置與測試，不發布。

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 手動執行 = 試跑：發布到 PyPI 與建立 Release 的工作只會在推送標籤時執行

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 測試
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: 檢查這一版有沒有寫「本版重點」
        if: github.event_name == 'push'
        shell: bash
        run: |
          # Release 說明的最前面是 release-notes/<標籤>.md；沒寫就在最前面停下，不要等 PyPI 發布了才發現
          if [ ! -s "release-notes/${GITHUB_REF_NAME}.md" ]; then
            echo "::error::缺少 release-notes/${GITHUB_REF_NAME}.md：請先寫這一版的重點（見 README 的「發布新版本」）"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.3.3
      - name: 安裝依賴（含桌面版）
        run: uv sync --locked --extra desktop
      - name: 執行測試
        run: uv run pytest -q

  dist:
    name: 建置 Python 套件
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: 檢查版本號與標籤一致
        id: ver
        shell: bash
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml 的版本：$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::標籤是 $GITHUB_REF_NAME，但 pyproject.toml 的版本是 $version。請先把版本改對、重新打標籤。"
            exit 1
          fi
      - name: 建置 wheel 與 sdist
        run: uv build
      - name: 檢查 PyPI 上的說明文件能否正確顯示
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  exe:
    name: 打包 Windows 執行檔
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: 讀取版本號
        id: ver
        shell: pwsh
        run: |
          $v = uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: 安裝依賴（含桌面版與 PyInstaller）
        run: uv sync --locked --extra desktop
      - name: 用 PyInstaller 打包
        run: uv run pyinstaller packaging/TubeTran.spec --noconfirm --clean --distpath packaging/dist --workpath packaging/build
      - name: 附上 TubeTran.exe.config（讓 .NET 允許載入帶「來自網際網路」標記的組件；必須和 TubeTran.exe 在同一層）
        shell: pwsh
        run: Copy-Item packaging/TubeTran.exe.config packaging/dist/TubeTran/TubeTran.exe.config
      - name: 自我檢查（各依賴是否都被正確打包）
        shell: pwsh
        run: |
          $exe = (Resolve-Path packaging/dist/TubeTran/TubeTran.exe).Path
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $env:TUBETRAN_DATA_DIR = Join-Path $env:RUNNER_TEMP "selftest-data"
          $env:TUBETRAN_SELFTEST_OUT = $out
          # 視窗程式沒有主控台輸出，所以看結束碼，並從檔案讀結果
          $p = Start-Process $exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out -Raw }
          if ($p.ExitCode -ne 0) { throw "--selftest 失敗，結束碼 $($p.ExitCode)" }
      - name: 煙霧測試（以伺服器模式啟動，確認首頁與前端檔可以取得）
        shell: pwsh
        run: |
          $exe = (Resolve-Path packaging/dist/TubeTran/TubeTran.exe).Path
          $env:TUBETRAN_DATA_DIR = Join-Path $env:RUNNER_TEMP "smoke-data"
          $env:ANTHROPIC_API_KEY = "sk-ant-ci-smoke-test"
          $proc = Start-Process $exe -ArgumentList "--server","--port","8017" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep 1
              try { $r = Invoke-WebRequest http://127.0.0.1:8017/ -UseBasicParsing -TimeoutSec 3; $ok = $true; break } catch {}
            }
            if (-not $ok) { throw "伺服器 60 秒內沒有啟動" }
            foreach ($u in "/", "/static/app.js", "/static/desktop.js", "/static/style.css", "/api/settings", "/api/library") {
              $s = (Invoke-WebRequest "http://127.0.0.1:8017$u" -UseBasicParsing -TimeoutSec 20).StatusCode
              "$u -> $s"
              if ($s -ne 200) { throw "$u 回傳 $s" }
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: 壓縮成 ZIP
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Copy-Item LICENSE, README.md, README.en.md packaging/dist/TubeTran/
          $zip = "TubeTran-v$v-windows-x64.zip"
          Compress-Archive -Path packaging/dist/TubeTran -DestinationPath $zip -CompressionLevel Optimal
          "{0}：{1:N0} MB" -f $zip, ((Get-Item $zip).Length / 1MB)
          # SHA-256 校驗檔（格式同 sha256sum：「雜湊值  檔名」），下載後可以核對檔案沒有損壞或被改動
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          "SHA-256: $hash"
          "zip=$zip" >> $env:GITHUB_ENV
      - name: 下載情境測試（對最後的 ZIP：每個檔案帶「來自網際網路」標記後，要能真的開出桌面視窗）
        shell: pwsh
        run: |
          # 從 GitHub 下載 ZIP 再解壓縮的檔案都帶這個標記，.NET Framework 預設會拒絕載入帶標記的組件。
          # CI 內部直接建置的檔案沒有標記，所以 smoke_window.ps1 要自己加上去，否則測不到這類問題（0.1.1 就是這樣漏掉的）。
          # 對照組：拿掉 TubeTran.exe.config，必須失敗。這證明這個測試真的抓得到問題，而不是永遠通過。
          pwsh -NoProfile -File packaging/smoke_window.ps1 -Zip $env:zip -RemoveConfig
          if ($LASTEXITCODE -eq 0) { throw "對照組應該失敗卻成功了：這個測試抓不到『帶標記就無法載入 .NET 組件』的問題，請檢查測試方法" }
          # 正式：附帶設定檔的 ZIP，帶標記也必須開得了視窗
          pwsh -NoProfile -File packaging/smoke_window.ps1 -Zip $env:zip
          if ($LASTEXITCODE -ne 0) { throw "帶網路來源標記的 ZIP 無法正常開啟視窗（見上方記錄）" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            ${{ env.zip }}
            ${{ env.zip }}.sha256
          if-no-files-found: error

  dmg:
    name: 打包 macOS App（Apple 晶片）
    needs: test
    runs-on: macos-latest # Apple 晶片（arm64）；不提供 Intel 版
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: 讀取版本號
        id: ver
        run: |
          v=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: 安裝依賴（含桌面版與 PyInstaller）
        run: uv sync --locked --extra desktop
      - name: 用 PyInstaller 打包
        run: uv run pyinstaller packaging/TubeTran.spec --noconfirm --clean --distpath packaging/dist --workpath packaging/build
      - name: 附上 TubeTran.exe.config（讓 .NET 允許載入帶「來自網際網路」標記的組件；必須和 TubeTran.exe 在同一層）
        shell: pwsh
        run: Copy-Item packaging/TubeTran.exe.config packaging/dist/TubeTran/TubeTran.exe.config
      - name: 自我檢查（各依賴是否都被正確打包）
        run: |
          export TUBETRAN_DATA_DIR="$RUNNER_TEMP/selftest-data"
          export TUBETRAN_SELFTEST_OUT="$RUNNER_TEMP/selftest.json"
          code=0
          packaging/dist/TubeTran.app/Contents/MacOS/TubeTran --selftest >/dev/null 2>&1 || code=$?
          [ -f "$TUBETRAN_SELFTEST_OUT" ] && cat "$TUBETRAN_SELFTEST_OUT"
          if [ "$code" -ne 0 ]; then echo "::error::--selftest 失敗，結束碼 $code"; exit 1; fi
      - name: 煙霧測試（以伺服器模式啟動，確認首頁與前端檔可以取得）
        run: |
          export TUBETRAN_DATA_DIR="$RUNNER_TEMP/smoke-data"
          export ANTHROPIC_API_KEY="sk-ant-ci-smoke-test"
          packaging/dist/TubeTran.app/Contents/MacOS/TubeTran --server --port 8017 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 60); do
            sleep 1
            if curl -fs -o /dev/null http://127.0.0.1:8017/; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "::error::伺服器 60 秒內沒有啟動"; exit 1; }
          for u in / /static/app.js /static/desktop.js /static/style.css /api/settings /api/library; do
            s=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8017$u")
            echo "$u -> $s"
            [ "$s" = 200 ] || { echo "::error::$u 回傳 $s"; exit 1; }
          done
      - name: 封裝成 DMG
        run: |
          v="${{ steps.ver.outputs.version }}"
          dmg="TubeTran-v$v-macos-arm64.dmg"
          # 磁碟映像的內容：App、Applications 捷徑（拖曳安裝用）、授權與說明
          stage="$RUNNER_TEMP/dmg-root"
          rm -rf "$stage" && mkdir -p "$stage"
          cp -R packaging/dist/TubeTran.app "$stage/"
          ln -s /Applications "$stage/Applications"
          cp LICENSE README.md README.en.md "$stage/"
          # hdiutil 在 CI 上偶爾會回報「Resource busy」，失敗就重試
          for i in 1 2 3; do
            hdiutil create -volname "TubeTran" -srcfolder "$stage" -ov -format UDZO "$dmg" && break
            echo "hdiutil 失敗（第 $i 次），5 秒後重試"; sleep 5
          done
          [ -f "$dmg" ] || { echo "::error::DMG 建立失敗"; exit 1; }
          hdiutil verify "$dmg"
          ls -lh "$dmg"
          hash=$(shasum -a 256 "$dmg" | cut -d' ' -f1)
          echo "$hash  $dmg" > "$dmg.sha256"
          echo "SHA-256: $hash"
          echo "dmg=$dmg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            ${{ env.dmg }}
            ${{ env.dmg }}.sha256
          if-no-files-found: error

  publish-pypi:
    name: 發布到 PyPI
    # 只有推送標籤才會發布；手動試跑不會
    if: github.event_name == 'push'
    needs: [test, dist, exe, dmg]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tubetran/
    permissions:
      id-token: write # 受信任的發布者（Trusted Publishing）需要
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # 如果設定了 PYPI_API_TOKEN 這個 secret 就用它；沒有的話（留空）改用受信任的發布者，不需要任何金鑰
          password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: 建立 GitHub Release
    if: github.event_name == 'push'
    needs: [test, dist, exe, dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # 為了讀取 release-notes/<標籤>.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 建立 Release 並上傳檔案
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          # Release 說明 = release-notes/<標籤>.md 的「本版重點」，加上 GitHub 自動附的變更記錄連結。
          # 安裝與使用方式寫在 README，不在每個 Release 裡重複。
          cp "release-notes/$TAG.md" notes.md
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TubeTran $TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
